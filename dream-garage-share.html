<!--
  CarCupid — Dream Garage · Shareable Card (9:16 for Stories/Reels)
  ------------------------------------------------------------------
  Self-contained demo. The card renders at a native 540×960 and exports
  at 2x → 1080×1920 (Instagram Story / Reel cover size).

  PORTING TO NEXT — IMPORTANT:
    This demo uses html2canvas for an in-browser download so you can see
    it work. For PRODUCTION the right tool is @vercel/og (Satori):
    generate the PNG server-side from JSX at the edge — sharper text,
    real fonts, works for OG tags + on-demand share images, no client lib.
    Ask me and I'll hand you the /api/og route version of this card.

  HOOKS:
    // HOOK A: feed a real garage object (from the builder / saved garage)
    //         into renderCard() instead of the SAMPLE presets.
    // HOOK B: swap the silhouette for a real car image (carImage()).
  ------------------------------------------------------------------
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CarCupid — Dream Garage · Share Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#121217; --ink-2:#181820; --ink-3:#20212A; --ink-4:#2A2B36;
    --coral:#EF5847; --coral-2:#D8412F;
    --bone:#F3F0EA; --mute:#9A9BA8; --mute-2:#686A78;
    --line:rgba(243,240,234,.10); --line-2:rgba(243,240,234,.06);
    --font-display:"Playfair Display",Georgia,serif;
    --font-ui:"Space Grotesk",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#0C0C10; color:var(--bone); font-family:var(--font-ui);
    min-height:100vh; padding:32px 16px 56px;
    background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);
    background-size:64px 64px,64px 64px;
  }
  ::selection{ background:var(--coral); color:#fff; }

  /* ---------- demo controls (NOT part of the exported image) ---------- */
  .controls{ max-width:540px; margin:0 auto 26px; text-align:center; }
  .controls h1{ font-family:var(--font-display); font-weight:600; font-size:24px; margin:0 0 4px; }
  .controls p{ color:var(--mute); font-size:14px; margin:0 0 20px; }
  .btnrow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .pill{
    font-family:var(--font-ui); font-weight:600; font-size:13.5px; cursor:pointer;
    background:var(--ink-3); color:var(--mute); border:1px solid var(--line);
    border-radius:999px; padding:9px 15px; transition:all .15s;
  }
  .pill:hover{ color:var(--bone); border-color:var(--mute-2); }
  .pill[aria-pressed="true"]{ background:var(--coral); border-color:var(--coral); color:#fff; }
  .download{
    font-family:var(--font-ui); font-weight:700; font-size:15px; cursor:pointer; color:#fff;
    background:var(--coral); border:0; border-radius:11px; padding:13px 26px; margin-top:18px;
    box-shadow:0 10px 26px rgba(239,88,71,.3); transition:all .15s;
  }
  .download:hover{ background:var(--coral-2); transform:translateY(-1px); }
  .download:disabled{ opacity:.5; cursor:wait; transform:none; }
  :focus-visible{ outline:2px solid var(--coral); outline-offset:3px; }

  /* ---------- stage (scales card to fit narrow screens) ---------- */
  .stage{ display:flex; justify-content:center; }
  .scaler{ transform-origin:top center; }

  /* ============ THE CARD — native 540×960, exported at 2x ============ */
  .card{
    width:540px; height:960px; position:relative; overflow:hidden;
    background:
      radial-gradient(130% 70% at 50% -8%, rgba(239,88,71,.16), transparent 55%),
      linear-gradient(180deg,#15151B,#101015);
    border:1px solid var(--line); border-radius:26px;
    padding:44px 40px; display:flex; flex-direction:column;
  }
  /* engineering grid texture inside the card */
  .card::before{
    content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);
    background-size:54px 54px,54px 54px;
  }
  .card > *{ position:relative; }

  .card__top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:700; font-size:21px; }
  .brand__mark{ width:32px; height:32px; border-radius:8px; background:radial-gradient(120% 120% at 30% 20%,var(--coral),var(--coral-2)); display:grid; place-items:center; color:#fff; font-size:16px; }
  .brand b{ color:var(--coral); }
  .card__eyebrow{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--mute-2); }

  .card__title{ font-family:var(--font-display); font-weight:700; font-size:42px; line-height:1.05; letter-spacing:-.015em; margin:30px 0 0; }
  .card__title em{ font-style:italic; color:var(--coral); }
  .card__meta{ display:flex; align-items:baseline; gap:10px; margin-top:14px; color:var(--mute); font-size:15px; }
  .card__meta b{ font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--bone); letter-spacing:-.01em; }
  .card__meta .dot{ width:4px; height:4px; border-radius:50%; background:var(--mute-2); display:inline-block; transform:translateY(-4px); }

  /* the cars */
  .fleet{ margin-top:26px; display:flex; flex-direction:column; gap:0; }
  .lot{ display:flex; align-items:center; gap:16px; padding:16px 0; border-top:1px solid var(--line); }
  .lot:last-child{ border-bottom:1px solid var(--line); }
  .lot__thumb{ width:108px; flex:0 0 108px; }
  .car-svg{ width:100%; height:auto; display:block; }
  .car-svg .body{ fill:var(--coral); }
  .car-svg .wheel{ fill:#2a1512; }
  .lot__info{ flex:1; min-width:0; }
  .lot__role{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--coral); }
  .lot__name{ font-family:var(--font-display); font-weight:600; font-size:21px; line-height:1.12; margin:3px 0 2px; }
  .lot__price{ font-family:var(--font-ui); font-weight:700; font-size:16px; color:var(--bone); }

  .card__foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:22px; }
  .card__cta{ font-family:var(--font-display); font-style:italic; font-size:17px; color:var(--bone); }
  .card__cta span{ color:var(--coral); font-style:normal; font-weight:600; }
  .card__url{ font-family:var(--font-ui); font-size:12.5px; letter-spacing:.04em; color:var(--mute-2); }

  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>
</head>
<body>

  <!-- DEMO CONTROLS (excluded from the exported PNG) -->
  <div class="controls">
    <h1>Dream Garage — share card</h1>
    <p>9:16 for Stories &amp; Reels. Flip a sample garage, then download.</p>
    <div class="btnrow" id="presets">
      <button class="pill" data-key="sensible">The $110k garage</button>
      <button class="pill" data-key="enthusiast" aria-pressed="true">The $200k garage</button>
      <button class="pill" data-key="dream">The $500k garage</button>
    </div>
    <br />
    <button class="download" id="downloadBtn">Download PNG (1080×1920)</button>
  </div>

  <div class="stage">
    <div class="scaler" id="scaler">
      <!-- ============ EXPORTED CARD ============ -->
      <div class="card" id="card">
        <div class="card__top">
          <div class="brand"><span class="brand__mark">♥</span>Car<b>Cupid</b></div>
          <div class="card__eyebrow">Dream Garage</div>
        </div>

        <h2 class="card__title" id="cardTitle">The Best-of-Both <em>Garage</em></h2>
        <div class="card__meta">
          <b id="cardTotal">$177,000</b>
          <span class="dot"></span>
          <span id="cardCount">3 cars, matched to a personality</span>
        </div>

        <div class="fleet" id="fleet"><!-- lots injected --></div>

        <div class="card__foot">
          <div class="card__cta">Build yours on <span>CarCupid</span></div>
          <div class="card__url">carcupid.com/garage</div>
        </div>
      </div>
      <!-- ============ /CARD ============ -->
    </div>
  </div>

<script>
/* ---------- data: sample built garages (// HOOK A: pass a real one) ---------- */
const ROLE_LABEL = {
  daily:"Daily Driver", hauler:"Family Hauler", thrill:"Weekend Thrill",
  statement:"The Statement", explorer:"The Explorer", project:"The Project",
};

const SAMPLE = {
  sensible:{ cars:[
    {role:"daily",   name:"Honda Civic Touring", price:24000},
    {role:"hauler",  name:"Kia Telluride",       price:42000},
    {role:"explorer",name:"Ford Bronco Badlands",price:46000},
  ]},
  enthusiast:{ cars:[
    {role:"daily",  name:"Genesis G70",         price:42000},
    {role:"hauler", name:"Volvo XC90",          price:60000},
    {role:"thrill", name:"Porsche 718 Cayman",  price:75000},
  ]},
  dream:{ cars:[
    {role:"statement",name:"Bentley Continental GT", price:250000},
    {role:"thrill",   name:"Porsche 911 Carrera S",  price:130000},
    {role:"explorer", name:"Land Rover Defender 110", price:62000},
  ]},
};

/* derive a shareable title from the roles in the garage */
function garageTitle(roles){
  const s = new Set(roles);
  if(s.has("statement"))                  return ["The Showstopper's", "Garage"];
  if(s.has("explorer") && s.has("thrill"))return ["The Go-Anywhere", "Garage"];
  if(s.has("thrill") || s.has("project")) return ["The Enthusiast's", "Garage"];
  if(s.has("explorer"))                   return ["The Adventurer's", "Garage"];
  if(s.has("hauler") && s.has("daily"))   return ["The Best-of-Both", "Garage"];
  return ["My Dream", "Garage"];
}

const fmt = n => "$" + Math.round(n).toLocaleString("en-US");

function carSVG(){
  // HOOK B: replace with <img src={carImage(car)} ...> when a listing photo exists
  return `<svg class="car-svg" viewBox="0 0 220 88" aria-hidden="true">
    <path class="body" d="M14 60 C14 54 18 52 24 52 L44 52 C50 40 62 33 84 33 L120 33 C142 33 154 41 168 52 L198 54 C208 55 212 57 212 61 L212 64 C212 67 209 68 205 68 L24 68 C18 68 14 66 14 60 Z"/>
    <circle class="wheel" cx="64" cy="68" r="13"/>
    <circle class="wheel" cx="170" cy="68" r="13"/>
  </svg>`;
}

function renderCard(garage){
  const roles = garage.cars.map(c => c.role);
  const [t1, t2] = garageTitle(roles);
  document.getElementById("cardTitle").innerHTML = `${t1} <em>${t2}</em>`;

  const total = garage.cars.reduce((s,c)=> s + c.price, 0);
  document.getElementById("cardTotal").textContent = fmt(total);
  document.getElementById("cardCount").textContent =
    `${garage.cars.length} cars, matched to a personality`;

  document.getElementById("fleet").innerHTML = garage.cars.map(c => `
    <div class="lot">
      <div class="lot__thumb">${carSVG()}</div>
      <div class="lot__info">
        <div class="lot__role">${ROLE_LABEL[c.role] || c.role}</div>
        <div class="lot__name">${c.name}</div>
        <div class="lot__price">${fmt(c.price)}</div>
      </div>
    </div>`).join("");
}

/* ---------- preset switcher ---------- */
document.getElementById("presets").addEventListener("click", e => {
  const b = e.target.closest(".pill"); if(!b) return;
  document.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", String(p===b)));
  renderCard(SAMPLE[b.dataset.key]);
});

/* ---------- fit-to-screen scaling (does not affect export) ---------- */
function fitCard(){
  const pad = 32;
  const avail = Math.min(540, document.documentElement.clientWidth - pad);
  const k = avail / 540;
  const scaler = document.getElementById("scaler");
  scaler.style.transform = `scale(${k})`;
  scaler.parentElement.style.height = (960 * k) + "px";
}
window.addEventListener("resize", fitCard);

/* ---------- PNG export (demo only; use @vercel/og in production) ---------- */
document.getElementById("downloadBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true; btn.textContent = "Rendering…";
  const scaler = document.getElementById("scaler");
  const prev = scaler.style.transform;
  scaler.style.transform = "scale(1)";          // capture at native size
  try{
    await document.fonts.ready;
    const canvas = await html2canvas(document.getElementById("card"), {
      scale: 2, backgroundColor: "#101015", useCORS: true, logging: false,
    });
    const link = document.createElement("a");
    link.download = "my-dream-garage.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  } catch(err){
    alert("Export failed in this preview — see console. (In Next, use @vercel/og.)");
    console.error(err);
  } finally {
    scaler.style.transform = prev;
    btn.disabled = false; btn.textContent = "Download PNG (1080×1920)";
  }
});

/* boot */
renderCard(SAMPLE.enthusiast);
fitCard();
</script>
</body>
</html>
